openapi: 3.1.0
info:
  title: PVM Agent Sandbox API
  version: 1.0.0
  description: |
    Control-plane REST surface of PVM (`uml-container`), a User-Mode Linux
    agent-sandbox manager. Covers the `/api` surface (Bearer auth via
    `API_SECRET`), the E2B-compatible root surface (`X-API-KEY` or Bearer),
    unauthenticated observability endpoints (`/healthz`, `/version`),
    `/metrics`, and the envd Connect-JSON compatibility service on :49983.
    The envd WebSocket version service (:49982) speaks a 5-byte envelope
    frame codec (1 flags + 4 len BE + JSON; end-stream flag 0x02) and is not
    expressible as an OpenAPI path; see the `envd` tag descriptions below.
  license:
    name: Repo license
externalDocs:
  description: Deployment guide
  url: https://github.com/NekoSekaiMoe/pvm/blob/main/deploy/README.md

servers:
  - url: http://localhost:8080
    description: API server (agentpvm api)
  - url: http://localhost:3000
    description: WebUI server (agentpvm webui; same routes)
  - url: http://localhost:49983
    description: envd Connect-JSON compatibility (no auth per E2B semantics)

security:
  - bearerAuth: []

tags:
  - { name: observability }
  - { name: containers }
  - { name: tasks }
  - { name: files }
  - { name: exec }
  - { name: audit }
  - { name: approvals }
  - { name: policy }
  - { name: pool }
  - { name: gate }
  - { name: volumes }
  - { name: templates }
  - { name: egress }
  - { name: network }
  - { name: identity }
  - { name: incidents }
  - { name: e2b }
  - { name: envd }

paths:
  # ---------------------------------------------------------------- observability
  /healthz:
    get:
      tags: [observability]
      summary: Liveness probe (no auth)
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_seconds]
                properties:
                  status: { type: string, const: ok }
                  uptime_seconds: { type: integer, format: int64 }

  /version:
    get:
      tags: [observability]
      summary: Build/version info (no auth)
      security: []
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /metrics:
    get:
      tags: [observability]
      summary: Prometheus text metrics
      description: Bearer auth by default; set `PVM_METRICS_NOAUTH=1` to disable auth.
      responses:
        "200":
          description: Prometheus exposition text
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- containers
  /api/containers:
    get:
      tags: [containers]
      summary: List containers
      responses:
        "200":
          description: Container list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Container" }

  /api/containers/start:
    post:
      tags: [containers]
      summary: Start a UML container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootfs]
              properties:
                name: { type: string, description: 'defaults to "web-container"; must match ^[a-zA-Z0-9_-]+$' }
                rootfs: { type: string, description: absolute path to ext4 rootfs image inside the image root }
                mem: { type: string, description: e.g. "512M"; default "512M" }
                cpu: { type: integer, minimum: 0, maximum: 1024, default: 0 }
                ephemeral: { type: boolean, default: false, description: mount rootfs read-only }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: started }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Error" }

  /api/containers/{id}/logs:
    get:
      tags: [containers]
      summary: Read container logs
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: tail, in: query, schema: { type: integer }, description: trailing lines }
      responses:
        "200":
          description: Log text
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}:
    delete:
      tags: [containers]
      summary: Stop and remove a container
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: removed }
                  name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/snapshot:
    post:
      tags: [containers]
      summary: Snapshot a container
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/restore:
    post:
      tags: [containers]
      summary: Restore a container from snapshot
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/clone:
    post:
      tags: [containers]
      summary: Clone a container (block-level CoW)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/containers/{id}/rollback:
    post:
      tags: [containers]
      summary: Roll a container back to a snapshot
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { name: snap, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/images/pull:
    post:
      tags: [containers]
      summary: Pull a docker image and convert to ext4 rootfs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: docker image ref }
                name: { type: string, description: output rootfs name }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- tasks
  /api/tasks:
    get:
      tags: [tasks]
      summary: List all tasks with FSM state
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskState" }

  /api/tasks/{id}:
    get:
      tags: [tasks]
      summary: Get one task (unique id prefix accepted)
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskState" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/transition:
    post:
      tags: [tasks]
      summary: Drive a lifecycle FSM transition
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PENDING, RUNNING, SUSPENDED, STOPPED, FAILED, COMPLETED]
                actor: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/tasks/load-spec:
    post:
      tags: [tasks]
      summary: Validate a TaskSpec TOML without launching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: path to a .toml file on the host }
                content: { type: string, description: inline TOML }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/tasks/{id}/console:
    get:
      tags: [tasks]
      summary: Recent console output (ring buffer tail)
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200":
          description: Console tail
          content:
            application/json:
              schema:
                type: object
                properties:
                  tail: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/metrics:
    get:
      tags: [tasks]
      summary: Per-task runtime metrics
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200":
          description: Metrics payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  net_tx_bytes: { type: integer, format: int64 }
                  net_rx_bytes: { type: integer, format: int64 }
                  egress_denied_total: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/pause:
    post:
      tags: [tasks]
      summary: Pause (suspend) a running task
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/tasks/{id}/resume:
    post:
      tags: [tasks]
      summary: Resume a suspended task
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/tasks/{id}/snapshots:
    get:
      tags: [tasks]
      summary: List task snapshots
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snapshot" }
    post:
      tags: [tasks]
      summary: Create a task snapshot
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/snapshots/{snapId}:
    get:
      tags: [tasks]
      summary: Get one snapshot
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/SnapIdPath" }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      summary: Delete a snapshot
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/SnapIdPath" }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/clone:
    post:
      tags: [tasks]
      summary: Clone a task
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/rollback:
    post:
      tags: [tasks]
      summary: Roll a task back to a snapshot
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { name: snap, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- files
  /api/tasks/{id}/files/list:
    get:
      tags: [files]
      summary: List workspace directory entries
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/FilePathQuery" }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileInfo" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/stat:
    get:
      tags: [files]
      summary: Stat a workspace file
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/FilePathQuery" }
      responses:
        "200":
          description: File info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/read:
    get:
      tags: [files]
      summary: Read a workspace file (binary body)
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/FilePathQuery" }
      responses:
        "200":
          description: Raw file bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/write:
    put:
      tags: [files]
      summary: Write a workspace file (binary body)
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/FilePathQuery" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/mkdir:
    post:
      tags: [files]
      summary: Create a directory in the workspace
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathBody" }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/tasks/{id}/files/remove:
    post:
      tags: [files]
      summary: Remove a workspace file/directory
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PathBody"
                - type: object
                  properties:
                    recursive: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/rename:
    post:
      tags: [files]
      summary: Rename/move a workspace entry
      parameters: [{ $ref: "#/components/parameters/TaskIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, to]
              properties:
                path: { type: string }
                to: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks/{id}/files/watch:
    get:
      tags: [files]
      summary: Long-poll workspace change events
      parameters:
        - { $ref: "#/components/parameters/TaskIdPath" }
        - { $ref: "#/components/parameters/FilePathQuery" }
        - { name: since, in: query, schema: { type: integer, format: int64, default: 0 } }
      responses:
        "200":
          description: Change events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    op: { type: string, enum: [create, write, remove, rename, chmod] }
                    path: { type: string }
                    ts: { type: integer, format: int64 }

  # ---------------------------------------------------------------- exec
  /api/exec:
    post:
      tags: [exec]
      summary: Tool Gateway exec
      description: |
        Executes `"name arg=val ..."` through the per-task policy gateway.
        Task id comes from `?task=` or the `X-Task-Id` header.
        A policy denial that requires human approval returns 202 with
        `{"status":"approval_required"}`.
      parameters:
        - { name: task, in: query, schema: { type: string } }
        - { name: X-Task-Id, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, description: '"name arg=val arg2 ..."' }
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "202":
          description: Approval required
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: approval_required }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- audit
  /api/audit/{id}:
    get:
      tags: [audit]
      summary: Read a task's audit ledger
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Ledger events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/audit/{id}/verify:
    get:
      tags: [audit]
      summary: Verify ledger hash chain (and ed25519 record signatures when a key is present)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  checked: { type: integer }
                  signatures: { type: string, enum: [none, verified, failed] }

  /api/audit/redaction-policy:
    get:
      tags: [audit]
      summary: Read the redaction policy
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
    put:
      tags: [audit]
      summary: Update the redaction policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patterns:
                  type: array
                  items: { type: string }
                mode: { type: string, enum: [redact, block, allow] }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- approvals
  /api/approvals:
    get:
      tags: [approvals]
      summary: List pending approval tickets
      parameters:
        - { name: task, in: query, schema: { type: string } }
        - { name: all, in: query, schema: { type: string, enum: ["1"] }, description: include decided tickets }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ticket" }
    post:
      tags: [approvals]
      summary: Create an approval ticket
      description: Server notifies `PVM_APPROVAL_WEBHOOK_URL` when configured; tickets persist across restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Ticket" }
      responses:
        "200":
          description: Ticket id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/approvals/{id}/decide:
    post:
      tags: [approvals]
      summary: Approve or reject a ticket
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                by: { type: string }
      responses:
        "200":
          description: Decided ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/approvals/{id}/edit:
    post:
      tags: [approvals]
      summary: Edit a pending ticket's params (returns it to pending)
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  additionalProperties: true
                reason: { type: string }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- policy
  /api/policy/{task}:
    get:
      tags: [policy]
      summary: Read compiled tool rules for a task
      parameters: [{ $ref: "#/components/parameters/TaskPath" }]
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolRule" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [policy]
      summary: Register/update compiled tool rules for a task
      parameters: [{ $ref: "#/components/parameters/TaskPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ToolRule" }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------------------------------------------------------------- pool
  /api/pool/stats:
    get:
      tags: [pool]
      summary: Warm pool stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: integer }
                  claimed: { type: integer }
                  total: { type: integer }

  /api/pool/warm:
    post:
      tags: [pool]
      summary: Pre-create warm sandboxes
      description: "Real warm: state-recorded sandboxes, kernel-attached when available. Pool + quota persist across restarts."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, count]
              properties:
                name: { type: string, description: template alias }
                count: { type: integer, minimum: 1, maximum: 100 }
                template: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Created count
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/pool/quota:
    get:
      tags: [pool]
      summary: Read per-tenant quota
      parameters:
        - { name: tenant, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }
    put:
      tags: [pool]
      summary: Update per-tenant quota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaRequest" }
      responses:
        "200": { $ref: "#/components/responses/OkJson" }
