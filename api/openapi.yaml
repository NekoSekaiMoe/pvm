# ============================================================================ components
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token; the token is the controller's API_SECRET.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: E2B SDK-style API key header; value is the API_SECRET.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Resource id (^[a-zA-Z0-9_-]+$).
    TaskIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Task id; a unique prefix is accepted (short id).
    TaskPath:
      name: task
      in: path
      required: true
      schema: { type: string }
      description: Task id or unique prefix.
    SnapIdPath:
      name: snapId
      in: path
      required: true
      schema: { type: string }
    FilePathQuery:
      name: path
      in: query
      required: true
      schema: { type: string }
      description: Path relative to the task workspace (hostfs dir).

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Policy denial
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OkJson:
      description: JSON status payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error text.

    VersionInfo:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        goos: { type: string }
        goarch: { type: string }

    Container:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
        memory_bytes: { type: integer, format: int64 }
        cpu: { type: integer }
        ephemeral: { type: boolean }

    TaskState:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        actor: { type: string }
        reason: { type: string }
        history:
          type: array
          items:
            type: object
            additionalProperties: true

    Snapshot:
      type: object
      properties:
        id: { type: string }
        task_id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }

    FileInfo:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        mode: { type: string }
        is_dir: { type: boolean }
        mod_time: { type: string, format: date-time }

    PathBody:
      type: object
      required: [path]
      properties:
        path: { type: string }

    ToolResult:
      type: object
      additionalProperties: true
      description: Opaque tool result from the policy gateway.

    ToolRule:
      type: object
      properties:
        tool: { type: string }
        effect: { type: string, enum: [allow, deny, approval] }
        params:
          type: object
          additionalProperties: true
        reason: { type: string }

    AuditEvent:
      type: object
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        kind: { type: string }
        payload:
          type: object
          additionalProperties: true
        prev_hash: { type: string }
        hash: { type: string }

    Ticket:
      type: object
      properties:
        id: { type: string }
        task: { type: string }
        tool: { type: string }
        params:
          type: object
          additionalProperties: true
        status: { type: string, enum: [pending, approved, rejected] }
        deadline: { type: string, format: date-time }
        decided_by: { type: string }

    Quota:
      type: object
      properties:
        maxConcurrent: { type: integer }
        maxCPU: { type: integer }
        maxMemoryMB: { type: integer }
        maxTasksPerHour: { type: integer }

    QuotaRequest:
      type: object
      required: [tenant]
      properties:
        tenant: { type: string }
        quota: { $ref: "#/components/schemas/Quota" }

    Volume:
      type: object
      properties:
        volume_id: { type: string }
        name: { type: string }
        driver: { type: string }
        refcount: { type: integer }
        created_at: { type: string, format: date-time }

    Template:
      type: object
      properties:
        template_id: { type: string }
        alias: { type: string }
        image_ref: { type: string }
        status: { type: string, enum: [PENDING, BUILDING, READY, FAILED] }
        kind: { type: string }
        created_at: { type: string, format: date-time }

    BuildProgress:
      type: object
      properties:
        phase: { type: string, enum: [queued, pull, extract, mkfs, copy, done, failed] }
        pct: { type: integer, minimum: 0, maximum: 100 }
        log_tail: { type: string }

    EgressPolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              port: { type: integer }
              action: { type: string, enum: [allow, deny, intercept] }
              mitm: { type: boolean, description: HTTPS interception for inject/audit }
        default_action: { type: string, enum: [allow, deny] }

    IdentityToken:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    Incident:
      type: object
      properties:
        id: { type: string }
        task: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        kind: { type: string }
        detail: { type: string }
        ts: { type: string, format: date-time }
        actions:
          type: array
          items: { type: string }

    Sandbox:
      type: object
      properties:
        sandboxID: { type: string }
        templateID: { type: string }
        clientID: { type: string }
        started_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
