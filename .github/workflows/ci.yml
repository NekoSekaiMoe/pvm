name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Build WebUI (Nuxt)
      working-directory: ./webui
      run: |
        npm install
        npx nuxi typecheck || true
        npm run generate

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'

    - name: Install eBPF (C) Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev gcc-multilib qemu-system-x86 clang-tidy

    - name: Run clang-tidy
      run: clang-tidy bpf/egress.c -- -I/usr/include -I/usr/include/bpf || true

    - name: Generate eBPF Bytecode
      run: go generate ./...

    - name: Build Main Binary
      run: |
        go build ./cmd/umlctl
        go build -o agentpvm ./cmd/agentpvm

    - name: Run unit tests
      run: go test -v ./...
      
    - name: Build UML Kernel
      run: |
        chmod +x scripts/build_kernel.sh
        sudo apt-get install -y build-essential libelf-dev pkg-config bc
        ./scripts/build_kernel.sh
        
    - name: Run Integration Scripts
      timeout-minutes: 15
      run: |
        FAILED=0
        echo "Running scripts in scripts/test_*.sh serially..."
        chmod +x scripts/test_*.sh || true
        for script in scripts/test_*.sh; do
          if [ -f "$script" ] && [ -x "$script" ]; then
            echo "Running $script..."
            ./"$script" || { echo "$script failed"; FAILED=1; }
          fi
        done
        
        echo "Running additional test suites serially..."
        chmod +x tests/*.sh
        for script in tests/*.sh; do
          if [ -f "$script" ]; then
            echo "Running $script..."
            sudo ./"$script" || { echo "$script failed"; FAILED=1; }
          fi
        done

        if [ $FAILED -ne 0 ]; then
          echo "One or more integration tests failed."
          exit 1
        fi

    - name: Dump logs on failure
      if: failure()
      run: |
        set +e
        echo "===== umlctl output (uml.log) ====="
        cat uml.log 2>/dev/null || echo "(no uml.log)"
        echo "===== agentpvm output (agentpvm.log) ====="
        cat agentpvm.log 2>/dev/null || echo "(no agentpvm.log)"
        echo "===== any other *.log files ====="
        for f in *.log; do
          [ -f "$f" ] || continue
          case "$f" in uml.log|agentpvm.log) continue;; esac
          echo "----- $f -----"
          cat "$f" 2>/dev/null || sudo cat "$f" 2>/dev/null || true
        done
        echo "===== UML container logs (console + strace) ====="
        for f in /var/lib/uml-container/containers/*/logs/*; do
          [ -f "$f" ] || continue
          echo "----- $f -----"
          sudo cat "$f"
        done
        echo "===== end of logs ====="

    - name: Dump cgroup state on failure
      if: failure()
      run: |
        set +e
        echo "===== whoami / id ====="
        id
        echo "===== mount /sys/fs/cgroup ====="
        mount | grep cgroup || true
        echo "===== root cgroup.controllers ====="
        cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || true
        echo "===== root cgroup.subtree_control ====="
        cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true
        echo "===== /sys/fs/cgroup/uml ====="
        ls -la /sys/fs/cgroup/uml 2>&1 || true
        echo "===== /sys/fs/cgroup/uml/cgroup.controllers ====="
        cat /sys/fs/cgroup/uml/cgroup.controllers 2>/dev/null || true
        echo "===== /sys/fs/cgroup/uml/cgroup.subtree_control ====="
        cat /sys/fs/cgroup/uml/cgroup.subtree_control 2>/dev/null || true
        for sub in /sys/fs/cgroup/uml/*; do
          [ -d "$sub" ] || continue
          echo "----- $sub -----"
          ls -la "$sub" 2>&1 || true
          echo "--- $sub/memory.max (cat attempt) ---"
          sudo cat "$sub/memory.max" 2>&1 || true
          echo "--- try writing memory.max as root ---"
          echo "9223372036854771712" | sudo tee "$sub/memory.max" >/dev/null 2>&1 && echo "write OK" || echo "write FAILED"
        done
        echo "===== systemd-cgls top ====="
        systemd-cgls --no-pager 2>/dev/null | head -40 || true
