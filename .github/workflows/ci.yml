name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            # Public ARM runners (2025-01): ubuntu-24.04-arm / ubuntu-22.04-arm.
            # The aarch64 leg builds the zalexdev UML arm64 kernel (pinned rev)
            # and runs the whole suite against it.
            runner: ubuntu-24.04-arm
    name: build-and-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Build WebUI (Nuxt)
      working-directory: ./webui
      run: |
        pnpm install --frozen-lockfile
        pnpm exec nuxt generate

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'

    - name: Install eBPF (C) Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld llvm libbpf-dev linux-libc-dev clang-tidy
        # aarch64: the UML arm64 port builds with LLVM=1 (clang maps
        # SUBARCH=arm64); gcc-multilib/qemu-system-x86 are x86-only extras.
        if [ "$(uname -m)" = "x86_64" ]; then
          sudo apt-get install -y gcc-multilib qemu-system-x86
        fi

    - name: Run clang-tidy
      run: clang-tidy bpf/egress.c -- -I/usr/include -I/usr/include/bpf || true

    - name: Generate eBPF Bytecode
      run: go generate ./...

    - name: Build Main Binary
      run: |
        go build ./cmd/umlctl
        go build -o agentpvm ./cmd/agentpvm

    - name: Run unit tests
      run: go test -v ./...

    - name: Run unit tests (privileged eBPF subset)
      # TestWhitelistRegistry creates real eBPF maps: unprivileged runs skip
      # it (EPERM, see filter_registry_test.go) so the leg above stays green
      # on hosts with unprivileged BPF disabled. This leg runs it for real,
      # scoped to one package+pattern — a blanket `sudo go test ./...` would
      # flip every test's permission semantics and root-own the go caches
      # for later non-root steps (HOME resets to /root, so caches stay
      # isolated at the cost of one module re-download).
      run: sudo env "PATH=$PATH" go test -v ./internal/network/ -run TestWhitelistRegistry

    - name: Run unit tests (privileged Jail & Namespace subset)
      # In unprivileged environments, tests that require user namespaces or
      # Landlock LSM skip gracefully. This leg runs the jail unit tests under sudo
      # to verify full process isolation, seccomp filters, and Landlock restrictions.
      run: sudo env "PATH=$PATH" go test -v ./internal/jail/
      
    - name: Build UML Kernel
      run: |
        chmod +x scripts/build_kernel.sh
        sudo apt-get install -y build-essential libelf-dev pkg-config bc git qemu-utils
        # LLVM=1 builds need ld.lld on PATH; the bare 'lld' package installs
        # it as /usr/lib/llvm-<n>/bin/ld.lld on some distro layouts. Export a
        # guaranteed-PATH location so kbuild's 'LD=ld.lld' resolves.
        LLD_DIR=$(dirname "$(find /usr/lib/llvm-*/bin /usr/bin -maxdepth 1 -name ld.lld 2>/dev/null | head -1)")
        echo "${LLD_DIR}" >> "$GITHUB_PATH"
        ./scripts/build_kernel.sh
        
    - name: Run Integration Scripts
      timeout-minutes: 15
      run: |
        FAILED=0
        echo "Running scripts in scripts/test_*.sh serially..."
        chmod +x scripts/test_*.sh || true
        for script in scripts/test_*.sh; do
          if [ -f "$script" ] && [ -x "$script" ]; then
            echo "Running $script..."
            ./"$script" || { echo "$script failed"; FAILED=1; }
          fi
        done
        
        echo "Running additional test suites serially..."
        chmod +x tests/*.sh
        for script in tests/*.sh; do
          if [ -f "$script" ]; then
            echo "Running $script..."
            sudo ./"$script" || { echo "$script failed"; FAILED=1; }
          fi
        done

        if [ $FAILED -ne 0 ]; then
          echo "One or more integration tests failed."
          exit 1
        fi

    - name: Dump logs on failure
      if: failure()
      run: |
        set +e
        echo "===== umlctl output (uml.log) ====="
        cat uml.log 2>/dev/null || echo "(no uml.log)"
        echo "===== agentpvm output (agentpvm.log) ====="
        cat agentpvm.log 2>/dev/null || echo "(no agentpvm.log)"
        echo "===== any other *.log files ====="
        for f in *.log; do
          [ -f "$f" ] || continue
          case "$f" in uml.log|agentpvm.log) continue;; esac
          echo "----- $f -----"
          cat "$f" 2>/dev/null || sudo cat "$f" 2>/dev/null || true
        done
        echo "===== UML container logs (console + strace) ====="
        for f in /var/lib/uml-container/containers/*/logs/*; do
          [ -f "$f" ] || continue
          echo "----- $f -----"
          sudo cat "$f"
        done
        echo "===== end of logs ====="

    - name: Dump cgroup state on failure
      if: failure()
      run: |
        set +e
        echo "===== whoami / id ====="
        id
        echo "===== mount /sys/fs/cgroup ====="
        mount | grep cgroup || true
        echo "===== root cgroup.controllers ====="
        cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || true
        echo "===== root cgroup.subtree_control ====="
        cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true
        echo "===== /sys/fs/cgroup/uml ====="
        ls -la /sys/fs/cgroup/uml 2>&1 || true
        echo "===== /sys/fs/cgroup/uml/cgroup.controllers ====="
        cat /sys/fs/cgroup/uml/cgroup.controllers 2>/dev/null || true
        echo "===== /sys/fs/cgroup/uml/cgroup.subtree_control ====="
        cat /sys/fs/cgroup/uml/cgroup.subtree_control 2>/dev/null || true
        for sub in /sys/fs/cgroup/uml/*; do
          [ -d "$sub" ] || continue
          echo "----- $sub -----"
          ls -la "$sub" 2>&1 || true
          echo "--- $sub/memory.max (cat attempt) ---"
          sudo cat "$sub/memory.max" 2>&1 || true
          echo "--- try writing memory.max as root ---"
          echo "9223372036854771712" | sudo tee "$sub/memory.max" >/dev/null 2>&1 && echo "write OK" || echo "write FAILED"
        done
        echo "===== systemd-cgls top ====="
        systemd-cgls --no-pager 2>/dev/null | head -40 || true

  bazel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    # npm deps and the Nuxt static assets are now built by Bazel itself
    # (rules_js npm_translate_lock + //webui:nuxt_generate), and eBPF bytecode
    # is generated by //internal/network:bpf2go_* — no manual generate steps.
    # clang/libbpf headers are needed on the host for the bpf2go actions
    # (they are host tools, not fully hermetic yet).
    - name: Install eBPF toolchain
      run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev

    - name: Bazel build
      run: bazelisk build //...

    - name: Bazel test
      run: bazelisk test //... --test_output=errors
