name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run unit tests
      run: go test -v ./...
      
    - name: Build UML Kernel
      run: |
        chmod +x scripts/build_kernel.sh
        sudo apt-get update && sudo apt-get install -y build-essential libelf-dev pkg-config bc
        ./scripts/build_kernel.sh
        
    - name: Run Integration Script
      run: |
        chmod +x scripts/test_integration.sh
        ./scripts/test_integration.sh
