# PVM Agent Sandbox — TaskSpec (plan.md §9 control contract)
#
# This is the EXAMPLE config consulted by `agentpvm run` when no -config is
# given. It demonstrates every control plane. Unlike a hardened production
# baseline, this file is a DEVELOPMENT/DEMO profile: networking is enabled and
# a broad package-registry allowlist is configured so an agent can fetch deps.
# `agentpvm run -name <unique-id>` (or an explicit -config) should be used in
# multi-tenant or production settings; see plan.md §9 for the safe defaults.
#
# umlctl also accepts this file via -config but only consumes the launch fields
# (runtime/workspace/kernel/network tap) — it ignores the control planes.

version = 1
caller  = "demo-user"      # WHO authorized this task (required; override per invocation)
tenant  = "default"        # multi-tenant quota scope (override per invocation)

# --- runtime / sandbox shape ---
[runtime]
name   = "agent-task"      # also used as the task id; override with -name per invocation
cpu    = 1000              # millicpu; 1000 = 1 full CPU. 0 = unlimited
memory = "512M"

[workspace]
base_image = "rootfs.img"   # read-only backing image, shared by N sandboxes. Raw ext4 for the ubd path (use_vhost_blk=false); qcow2 for the vhost path (default).
# overlay is auto-derived as <statedir>/rootfs.qcow2 when omitted (vhost path only)
init      = "/sbin/init"
# Rebuild the per-task qcow2 overlay in place right after the sandbox exits:
# only allocated clusters are rewritten, zero clusters become ZERO-flag
# entries, and unused preallocated metadata is dropped. Pure-Go equivalent of
# `qemu-img convert -O qcow2` (no qemu binaries needed). Keeps snapshot
# exports / state dirs small. vhost path only; non-fatal on failure.
compact_on_exit = true

[kernel]
path          = "./bin/linux"
virtio        = false      # legacy field, no effect (block backend is selected by use_vhost_blk; network is always vec0 — the only UML net transport in Linux >= 6.16)
# use_vhost_blk selects the block backend AND whether CoW is in play:
#   false:           ubd0=<base> raw mount. CoW-free.
#   true (default):  qcow2 overlay served by qemu-storage-daemon over
#                    vhost-user-blk. CoW isolation. Verified end-to-end in CI
#                    by tests/04_test_qcow2_mount.sh (guest boots from /dev/vda
#                    with working vec0 networking).
# Networking uses the vec0 transport (the only UML net transport in
# Linux >= 6.16; legacy eth0=tuntap was removed). Requires the kernel to be
# built with CONFIG_UML_NET_VECTOR (see scripts/build_kernel.sh + todo.md);
# independent of this switch.
use_vhost_blk = true

# --- network egress (plan.md §4) ---
# DEVELOPMENT profile: networking is ENABLED here so a demo agent can reach
# package registries. The L7 proxy allowlist + eBPF IP floor below still apply.
# For a network-isolated task, set `enabled = false` (the safeDefaultSpec path).
[network]
enabled       = true      # DEVELOPMENT: NIC created; egress still gated below
bridge        = "br0"
gateway_ip    = "10.0.0.1/24"
tap           = ""        # auto-derived from task name when empty
max_request_body_bytes = 1048576   # 1 MiB upload cap
qos_rate      = ""        # e.g. "10mbit"

# Domain allowlist enforced by the L7 CONNECT proxy. HTTPS sees the domain via
# SNI without TLS MITM. Wildcards supported: "*.github.com".
egress_allow_domains = [
    "github.com",
    "*.githubusercontent.com",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
egress_block_domains = [
    "169.254.169.254",   # cloud metadata (also blocked by eBPF floor)
]

# Extended L7 rules (Cube parity: docs/guide/security-proxy.md).
# First match wins. Example: read-only api.github.com access, no credentials:
# [[network.egress_rules]]
# name   = "github-api"
# host   = "api.github.com"
# scheme = "https"
# method = ["GET"]
# allow  = true
#
# Credential injection (the egress_rules.inject block and its plaintext
# `secret` field) is deliberately NOT documented here: inline secrets in
# config files are how tokens leak. Examples will be provided once injection
# is fed from a secure external credential source (the Credential Broker)
# instead of spec-embedded secrets.

# --- tool / policy gateway (plan.md §6) ---
# First match wins; a default-deny catch-all is auto-appended.
[[tools]]
name   = "read_file"
action = "allow"
effect = "read"

[[tools]]
name   = "write_file"
action = "constrain"
effect = "write"
reason = "writes allowed only inside the task workspace branch"

[[tools]]
name   = "send_email"
action = "approve"        # pauses for a bound human approval ticket
effect = "send"
reason = "external side-effect"

[[tools]]
name   = "deploy"
action = "deny"
effect = "prod"
reason = "production deploy denied by default"

# --- budget (plan.md §9.2) ---
[budget]
max_wall_time  = "15m"    # hard wall-clock cap; on expiry FSM -> Destroy
max_tokens     = 200000   # LLM token cap; 0 = unlimited
max_network_mb = 512      # egress byte cap; 0 = unlimited
max_cost_micro_usd = 0   # spend cap; 0 = unlimited

# --- approval boundary (plan.md §10) ---
[approval]
required_for = ["send", "delete", "deploy"]  # which actions pause for a human
notify       = ""        # reserved: webhook/IM endpoint
timeout      = "5m"      # auto-deny if no decision within this window

# --- artifacts (plan.md §5.3, §7) ---
[artifacts]
declared = [
    "out/diff.patch",
    "out/build.log",
]
require_tests_passed = true
block_secrets        = true   # gate fails if a declared artifact diff has a secret

# --- lifecycle (plan.md §8, §11) ---
[lifecycle]
paused     = false      # start in Suspended (checkpoint-on-start)
max_retries = 2         # Failed -> Provisioning attempts
on_anomaly  = "pause"   # "pause" (default) or "terminate"
ttl         = "1h"      # overall task lifetime
idle_timeout = ""       # e.g. "10m": freeze + Suspended after idle (single-host AutoPause)
auto_resume  = false     # when true, next API activity thaws Suspended -> Running

# --- volumes (Cube parity: persistent mounts) ---
# Each entry is mounted via the volume plugin framework (internal/volume).
# driver defaults to the first registered plugin when omitted; with the
# stock wiring that is "builtin" (the always-registered built-in
# host-directory driver — extra binary drivers come from
# PVM_VOLUME_PLUGINS). read_only exposes the mount as ro to the guest.
# path must be absolute and must not contain whitespace, ":" or ","
# (it is embedded verbatim in the hostfs_volume= kernel argument).
# [[volumes]]
# name      = "my-data"
# path      = "/workspace"
# driver    = "builtin"
# read_only = false
