<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVM Agent Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="md3-theme">
    <header class="top-app-bar glass">
        <div class="logo">
            <span class="material-symbols-outlined">deployed_code</span>
            <h1>AgentPVM Sandbox</h1>
        </div>
        <div class="actions">
            <button class="md3-icon-btn" id="theme-toggle">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </div>
    </header>

    <main class="dashboard">
        <section class="overview">
            <div class="md3-card stats-card surface-container">
                <div class="stat-content">
                    <h3>Active Agents</h3>
                    <p class="display-large" id="active-count">0</p>
                </div>
                <span class="material-symbols-outlined stat-icon">smart_toy</span>
            </div>
            <div class="md3-card stats-card surface-container">
                <div class="stat-content">
                    <h3>System Load</h3>
                    <p class="display-large">12%</p>
                </div>
                <span class="material-symbols-outlined stat-icon">memory</span>
            </div>
            <div class="md3-card stats-card surface-container">
                <div class="stat-content">
                    <h3>Network Egress</h3>
                    <p class="display-large">Secured</p>
                </div>
                <span class="material-symbols-outlined stat-icon">shield_lock</span>
            </div>
        </section>

        <section class="sandbox-list">
            <div class="section-header">
                <h2>Running Sandboxes</h2>
            </div>
            <div class="list-container" id="sandbox-container">
                <!-- Dynamically populated by JS -->
            </div>
        </section>
    </main>

    <button class="md3-fab primary-container" id="fab-new">
        <span class="material-symbols-outlined">add</span>
    </button>

    <script src="app.js"></script>
</body>
</html>
